name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Build static site (engine runs in the browser)
        working-directory: frontend
        env:
          VITE_STATIC: "1"
          # Served at the root of the custom domain (otistrade.online); use /<repo>/ for <user>.github.io/<repo>/
          VITE_BASE: ${{ vars.SITE_BASE || '/' }}
          # Set your own Deriv app id under Settings -> Secrets and variables -> Actions -> Variables
          VITE_DERIV_APP_ID: ${{ vars.DERIV_APP_ID || '1089' }}
          VITE_BRAND_NAME: ${{ vars.BRAND_NAME || 'Otis Trade' }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
